services:

  app:
    build: .
    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/travel_db
      REDIS_URL: redis://redis:6379/0

    depends_on:
      - db
      - redis


  db:
    image: postgres:16

    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"


volumes:

  postgres_data: